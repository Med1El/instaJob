name: ConcourNow Daily Scrape

on:
  schedule:
    # 9:00 PM Morocco time (UTC+1 in winter, UTC+0 in summer)
    # Using 20:00 UTC which covers both (Morocco observes no DST since 2018)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      triggered_by:
        description: "Who triggered this run"
        required: false
        default: "manual"
      first_run:
        description: "Force first run mode (scrape 5 pages)"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./app
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        working-directory: ./app
        env:
          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # AI
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Email
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          # Web Push
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # App
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          # Run context
          TRIGGERED_BY: ${{ github.event.inputs.triggered_by || 'cron' }}
          FIRST_RUN: ${{ github.event.inputs.first_run || 'false' }}
        run: node scripts/scraper.mjs

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: app/scraper-*.log
          retention-days: 7
